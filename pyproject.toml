[project]
name = "masterbench"
version = "0.1.0"
description = "Local-first mastering, mix-analysis and learning workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "anthropic",
    "audio-separator[cpu]",
    "audioread",
    "gradio",
    "librosa",
    "matchering",
    "mcp",
    "numpy",
    "pedalboard",
    "plotly",
    "pyloudnorm",
    "pyrubberband",
    "pyworld",
    "scipy",
    "setuptools<81",
    "soundfile",
    "typer",
    "watchdog",
]

[project.scripts]
masterbench = "masterbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masterbench"]

[dependency-groups]
dev = ["pyright", "pytest", "ruff"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# gr.Progress() as a default argument is how Gradio injects the progress tracker.
"src/masterbench/ui/*" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: exercises heavy third-party libraries (deselect with -m 'not slow')",
]
filterwarnings = [
    # Matchering imports scipy.ndimage.filters; tracked in NOTES.md.
    "ignore:Please import `maximum_filter1d`:DeprecationWarning",
]
